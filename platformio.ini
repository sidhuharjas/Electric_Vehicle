; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps =
	https://github.com/TektiteBiz/TektiteRotEv.git
monitor_speed = 115200

; Static code analysis (run with: pio check -e pico)
check_tool = cppcheck, clangtidy
check_src_filters =
	+<src/>
	+<include/>
	-<.pio/>
	-<test/>
check_flags =
	cppcheck: --enable=warning,style,performance,portability
	cppcheck: --std=c++11
	cppcheck: --inline-suppr
	cppcheck: --suppress=missingIncludeSystem
	clangtidy: --checks=bugprone-*,clang-analyzer-*,performance-*,readability-*
	clangtidy: --warnings-as-errors=bugprone-*,clang-analyzer-*
